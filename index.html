<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faxy Secure Vault</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="screen">
  <h1>Faxy Secure Vault</h1>

  <input id="userIdInput" placeholder="User ID">
  <input id="nameInput" placeholder="Preferred Name">

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Log In</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="screen hidden">

  <header>
    <h2 id="welcomeText"></h2>
    <button onclick="logout()">Logout</button>
  </header>

  <!-- ENCRYPTION -->
  <section class="card">
    <h3>Encryption Tool</h3>

    <textarea id="inputText" placeholder="Enter message..."></textarea>

    <select id="algorithm">
      <option>AES</option>
      <option>RSA</option>
      <option>Kyber</option>
    </select>

    <button onclick="encrypt()">Encrypt</button>

    <p id="status">Idle</p>
    <div id="output"></div>
    <div id="key"></div>
  </section>

  <!-- FRIENDS -->
  <section class="card">
    <h3>Friends</h3>

    <input id="friendId" placeholder="Enter User ID">
    <button onclick="addFriend()">Add Friend</button>

    <ul id="friendList"></ul>
  </section>

  <!-- THEME -->
  <section class="card">
    <h3>Theme</h3>

    <button onclick="setTheme('dark')">Dark</button>
    <button onclick="setTheme('purple')">Purple</button>
    <button onclick="setTheme('light')">Light</button>
  </section>

  <!-- LOGS -->
  <section class="card">
    <h3>Activity Log</h3>
    <div id="logs"></div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
