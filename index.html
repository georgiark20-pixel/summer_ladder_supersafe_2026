<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faxy Secure Vault</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- LOGIN -->
<div id="loginView" class="view">
  <div class="card center">
    <h1>Faxy Secure Vault</h1>
    <p class="sub">Secure Encryption & Identity System</p>

    <input id="userId" placeholder="User ID">
    <input id="name" placeholder="Preferred Name">

    <button onclick="signup()">Create Account</button>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="appView" class="view hidden">

  <header>
    <div>
      <h2 id="welcome"></h2>
      <small id="uid"></small>
    </div>
    <button class="logout" onclick="logout()">Logout</button>
  </header>

  <div class="grid">

    <!-- ENCRYPTION -->
    <div class="card">
      <h3>Encryption Tool</h3>

      <textarea id="input" placeholder="Enter message..."></textarea>

      <select id="algo">
        <option>AES</option>
        <option>RSA</option>
        <option>Kyber</option>
      </select>

      <button onclick="encrypt()">Encrypt</button>

      <div id="status">Idle</div>
      <div id="output"></div>
      <div id="key"></div>
    </div>

    <!-- FRIENDS -->
    <div class="card">
      <h3>Friends</h3>

      <input id="friendInput" placeholder="Enter User ID">
      <button onclick="addFriend()">Add Friend</button>

      <div id="friends"></div>
    </div>

    <!-- THEMES -->
    <div class="card">
      <h3>Theme</h3>
      <button onclick="setTheme('dark')">Dark</button>
      <button onclick="setTheme('purple')">Purple</button>
      <button onclick="setTheme('light')">Light</button>
    </div>

    <!-- LOGS -->
    <div class="card">
      <h3>Activity Log</h3>
      <div id="logs"></div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
